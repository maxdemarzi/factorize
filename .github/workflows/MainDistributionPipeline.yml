#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  # Branch pushes are covered by the pull_request trigger. Listing both
  # unqualified ran every commit twice -- two identical builds racing for the
  # same ccache, doubling CI cost and leaving the run list ambiguous about
  # which result was authoritative.
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

# v1.5-variegata is a branch, not a tag (confirmed via `git ls-remote --heads`
# vs `--tags`), so a name-based ref here or in ci_tools_version can move to a
# different commit than the one actually vendored in this repo's
# extension-ci-tools submodule -- CI's build/lint logic drifting independently
# of the pinned engine it is supposed to be testing. Pinned to the exact commit
# `git ls-tree HEAD extension-ci-tools` reports (matches the branch tip at the
# time of pinning; update deliberately alongside the submodule, not silently).
jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@72e76e99cd7fee45a99739cd118ec2db64e034ec
    with:
      duckdb_version: v1.5.5
      ci_tools_version: 72e76e99cd7fee45a99739cd118ec2db64e034ec
      extension_name: factorize
      # WASM is excluded deliberately, not accidentally (plan §7.6). The engine
      # holds an entire f-representation in memory with no spilling, and sizes
      # it against DuckDB's memory_limit; under wasm32 the address space makes
      # that budget meaningless, and the parallelism the design is heading for
      # has no threads to run on. Building a target we would have to describe as
      # "loads, then fails on anything worth using it for" is worse than not
      # shipping it.
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@72e76e99cd7fee45a99739cd118ec2db64e034ec
    with:
      duckdb_version: v1.5.5
      ci_tools_version: 72e76e99cd7fee45a99739cd118ec2db64e034ec
      extension_name: factorize
      format_checks: 'format;tidy'
